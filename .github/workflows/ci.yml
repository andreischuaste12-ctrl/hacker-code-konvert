name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install operating-system sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Enable Bubblewrap user namespaces on the ephemeral runner
        run: |
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -N kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Install project and pinned development tools
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-input --no-deps -e .

      - name: Build distributable package
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir /tmp/hck-wheel .

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Lint
        run: ruff check src scripts tests

      - name: Run tests
        run: pytest -q

      - name: Validate bundled JSON schemas
        run: |
          python -m json.tool src/hacker_code_konvert/data/finding.schema.json >/dev/null
          python -m json.tool src/hacker_code_konvert/data/run.schema.json >/dev/null

      - name: Run the isolated Semgrep fixture
        run: |
          if ! hck scan tests/fixtures/python --output /tmp/hck-fixture-report --authorized --scanner semgrep; then
            python -c "import json; from pathlib import Path; p=json.loads(Path('/tmp/hck-fixture-report/run.json').read_text()); m='; '.join(p['scanner']['errors']).replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A'); print(f'::error title=Isolated scanner failed::{m}')"
            exit 1
          fi

      - name: Measure fixture quality
        run: >-
          python scripts/evaluate_fixture_quality.py
          --findings /tmp/hck-fixture-report/findings.json
          --expected tests/fixtures/python/expected.json
          --output /tmp/hck-fixture-report/quality.json

      - name: Upload redacted quality artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixture-quality
          path: |
            /tmp/hck-fixture-report/run.json
            /tmp/hck-fixture-report/findings.json
            /tmp/hck-fixture-report/report.md
            /tmp/hck-fixture-report/quality.json
          if-no-files-found: warn
          retention-days: 14
