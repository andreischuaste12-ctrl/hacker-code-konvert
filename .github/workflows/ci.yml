name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly run so newly published advisories for pinned dependencies surface without a code change.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install operating-system sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor. This only relaxes the
      # ephemeral, single-use runner so the sandbox can be exercised; the CLI never changes host settings
      # and still fails closed where namespaces are unavailable.
      - name: Enable Bubblewrap user namespaces on the ephemeral runner
        run: |
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -N kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Install project and pinned development tools
        run: |
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-input --no-deps --no-build-isolation -e .

      - name: Audit pinned dependencies
        # Accepted advisories are documented, with rationale and removal conditions, in docs/DEPENDENCIES.md.
        run: >-
          pip-audit --disable-pip --no-deps -r requirements-dev.txt
          --ignore-vuln CVE-2026-59951
          --ignore-vuln CVE-2026-116684
          --ignore-vuln CVE-2026-116685
          --ignore-vuln CVE-2026-116686
          --ignore-vuln CVE-2026-114603

      - name: Build distributable package
        run: python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir /tmp/hck-wheel .

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Lint
        run: ruff check src scripts tests

      - name: Run tests
        # The sandbox and Semgrep integration tests must run here; a missing prerequisite is a failure,
        # and the JSON Schemas are validated against real output and the executable validator.
        env:
          HCK_REQUIRE_INTEGRATION: "1"
        run: pytest -q -ra

      - name: Run the isolated Semgrep fixture
        run: |
          if ! hck scan tests/fixtures/python --output /tmp/hck-fixture-report --authorized --scanner semgrep; then
            python -c "import json; from pathlib import Path; p=json.loads(Path('/tmp/hck-fixture-report/run.json').read_text()); m='; '.join(p['scanner']['errors']).replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A'); print(f'::error title=Isolated scanner failed::{m}')"
            exit 1
          fi

      - name: Measure fixture quality
        run: >-
          python scripts/evaluate_fixture_quality.py
          --findings /tmp/hck-fixture-report/findings.json
          --expected tests/fixtures/python/expected.json
          --output /tmp/hck-fixture-report/quality.json

      - name: Upload redacted quality artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixture-quality
          path: |
            /tmp/hck-fixture-report/run.json
            /tmp/hck-fixture-report/findings.json
            /tmp/hck-fixture-report/report.md
            /tmp/hck-fixture-report/quality.json
          if-no-files-found: warn
          retention-days: 14
