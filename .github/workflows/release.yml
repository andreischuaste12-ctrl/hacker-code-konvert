name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Require a signed release tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$package_version"
          test -n "$HCK_ALLOWED_SIGNERS"
          printf '%s\n' "$HCK_ALLOWED_SIGNERS" > /tmp/allowed-signers
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=/tmp/allowed-signers verify-tag "$GITHUB_REF_NAME"
        env:
          HCK_ALLOWED_SIGNERS: ${{ vars.HCK_RELEASE_ALLOWED_SIGNERS }}
      - run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m build --no-isolation
          python -m pip install --no-deps dist/*.whl
          cyclonedx-py requirements requirements-dev.txt --output-format JSON --output-file dist/development-sbom.json
          cyclonedx-py requirements requirements-semgrep.txt --output-format JSON --output-file dist/scanner-sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distribution
          path: dist/
  attest-release:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: distribution
          path: dist/
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: dist/*
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  publish:
    needs: attest-release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: distribution
          path: dist/
      - name: Keep non-distribution documents outside upload directory
        run: mkdir sbom && mv dist/*sbom.json sbom/
      - uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598
